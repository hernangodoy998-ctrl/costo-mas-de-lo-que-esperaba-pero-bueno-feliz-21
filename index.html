let floresVolando=[];

/*
==================================================
LÍMITE INVISIBLE DEL ÁRBOL
==================================================
*/

const LIMITE_ARBOL = .49;


/*
==================================================
REDIMENSIONAR
==================================================
*/

function resize(){

    const rect =
        canvas.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    canvas.width =
        W * devicePixelRatio;

    canvas.height =
        H * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

RAMAS

/*

*/

function crearRaices(){

        },

        {

/*
==================================================
FLORES DE LA COPA

IMPORTANTE:
Las flores ahora se generan siguiendo
la estructura de las ramas.

No usamos grandes rectángulos aleatorios.

Cada zona está pegada a una rama o
a la parte superior de la copa.
==================================================
*/

function crearFlores(){

    flores=[];


    /*
    Cada zona representa una parte real
    de la copa alrededor de las ramas.

    x = centro
    y = centro
    rx/ry = tamaño
    */

    const zonas=[

        /* Rama superior izquierda */
        {
            x:.55,
            y:.25,
            rx:.10,
            ry:.13
        },

        /* Parte superior central */
        {
            x:.65,
            y:.18,
            rx:.13,
            ry:.11
        },

        /* Parte superior derecha */
        {
            x:.77,
            y:.21,
            rx:.14,
            ry:.13
        },

        /* Rama izquierda */
        {
            x:.55,
            y:.38,
            rx:.11,
            ry:.12
        },

        /* Centro */
        {
            x:.67,
            y:.34,
            rx:.14,
            ry:.15
        },

        /* Rama derecha */
        {
            x:.80,
            y:.37,
            rx:.14,
            ry:.14
        },

        /* Extremo derecho */
        {
            x:.90,
            y:.31,
            rx:.10,
            ry:.11
        },

        /* Parte inferior de la copa */
        {
            x:.67,
            y:.46,
            rx:.16,
            ry:.12
        },

        {
            x:.81,
            y:.47,
            rx:.12,
            ry:.10
        }
    ];


    /*
    Generamos las flores dentro de cada
    zona elíptica.
    */

    for(let i=0;i<120;i++){

        const z=
            zonas[
                Math.floor(
                    Math.random()*
                    zonas.length
                )
            ];


        let x;
        let y;

        /*
        Elegimos un punto dentro de
        una elipse.
        */

        do{

            const angulo=
                Math.random()*
                Math.PI*2;

            const distancia=
                Math.sqrt(
                    Math.random()
                );

            x=
                z.x+
                Math.cos(angulo)*
                z.rx*
                distancia;

            y=
                z.y+
                Math.sin(angulo)*
                z.ry*
                distancia;

        }while(
            x<LIMITE_ARBOL+.035 ||
            y<.08 ||
            y>.59
        );


        /*
        La flor queda asociada a una
        posición natural de la copa.
        */

        flores.push({

            x:W*x,

            y:H*y,

            escala:
                .48+
                Math.random()*.55,

            rotacion:
                Math.random()*
                Math.PI*2,

            retraso:
                4.1+
                Math.random()*1.6
        });
    }
}


/*
==================================================
FLORES QUE VUELAN
==================================================
*/

function crearFloresVolando(){

    floresVolando=[];

    for(let i=0;i<28;i++){

        const origenX=
            W*
            (
                .48+
                Math.random()*.43
            );

        const origenY=
            H*
            (
                .20+
                Math.random()*.48
            );

        const destinoX=
            W*
            (
                .04+
                Math.random()*.35
            );

        const destinoY=
            H*
            (
                .20+
                Math.random()*.58
            );

        floresVolando.push({

            ox:origenX,
            oy:origenY,

            dx:destinoX,
            dy:destinoY,

            inicio:
                6000+
                i*280,

            duracion:
                2600+
                Math.random()*1300,

            escala:
                .38+
                Math.random()*.35,

            rotacion:
                Math.random()*
                Math.PI*2,

            amplitud:
                10+
                Math.random()*22,

            frecuencia:
                1+
                Math.random()*2
        });
    }
}


/*
==================================================
DIBUJAR FLOR
==================================================
*/

function dibujarFlor(
    x,
    y,
    escala,
    rotacion,
    alpha=1
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotacion);
    ctx.scale(escala,escala);

    ctx.globalAlpha=alpha;


    /*
    Tallo
    */

    ctx.strokeStyle="#55743d";
    ctx.lineWidth=1.8;

    ctx.beginPath();

    ctx.moveTo(0,8);
    ctx.lineTo(0,19);

    ctx.stroke();


    /*
    Pétalos
    */

    for(let i=0;i<5;i++){

        ctx.save();

        ctx.rotate(
            i*
            Math.PI*2/5
        );

        ctx.fillStyle="#f5c928";

        ctx.beginPath();

        ctx.ellipse(
            0,
            -8,
            6,
            11,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }


    /*
    Centro
    */

    ctx.fillStyle="#8a5b20";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/*
==================================================
DIBUJAR RAMA
==================================================
*/

function dibujarRama(r,t){

    let p=
        Math.max(
            0,
            Math.min(
                1,
                (t-r.retraso)/
                r.duracion
            )
        );

    if(p<=0)return;


    const x2=
        r.x1+
        (r.x2-r.x1)*p;

    const y2=
        r.y1+
        (r.y2-r.y1)*p;

    const cx=
        r.x1+
        (r.cx-r.x1)*p;

    const cy=
        r.y1+
        (r.cy-r.y1)*p;

    const grosor=
        r.grosorInicio+
        (
            r.grosorFinal-
            r.grosorInicio
        )*p;


    ctx.save();


    /*
    Sombra
    */

    ctx.beginPath();

    ctx.moveTo(
        r.x1+3,
        r.y1+3
    );

    ctx.quadraticCurveTo(
        r.cx+3,
        r.cy+3,
        x2+3,
        y2+3
    );

    ctx.strokeStyle=
        "rgba(35,25,19,.20)";

    ctx.lineWidth=
        grosor+4;

    ctx.lineCap="round";

    ctx.stroke();


    /*
    Rama principal
    */

    ctx.beginPath();

    ctx.moveTo(
        r.x1,
        r.y1
    );

    ctx.quadraticCurveTo(
        cx,
        cy,
        x2,
        y2
    );


    const grad=
        ctx.createLinearGradient(
            r.x1,
            r.y1,
            x2,
            y2
        );

    grad.addColorStop(
        0,
        "#39271e"
    );

    grad.addColorStop(
        .28,
        "#604333"
    );

    grad.addColorStop(
        .55,
        "#76503b"
    );

    grad.addColorStop(
        .78,
        "#5a3c2d"
    );

    grad.addColorStop(
        1,
        "#302119"
    );

    ctx.strokeStyle=grad;

    ctx.lineWidth=grosor;

    ctx.lineCap="round";

    ctx.stroke();


    /*
    Luz suave
    */

    ctx.beginPath();

    ctx.moveTo(
        r.x1,
        r.y1
    );

    ctx.quadraticCurveTo(
        cx,
        cy,
        x2,
        y2
    );

    ctx.lineWidth=
        Math.max(
            2,
            grosor*.25
        );

    ctx.strokeStyle=
        "rgba(190,145,105,.20)";

    ctx.stroke();

    ctx.restore();
}


/*
==================================================
RAÍCES
==================================================
*/

function dibujarRaices(){

    for(const r of raices){

        ctx.beginPath();

        ctx.moveTo(
            r.x1,
            r.y1
        );

        ctx.quadraticCurveTo(
            r.cx,
            r.cy,
            r.x2,
            r.y2
        );

        ctx.strokeStyle="#4b3326";

        ctx.lineWidth=r.grosor;

        ctx.lineCap="round";

        ctx.stroke();
    }
}

/*
==================================================
LETRAS
==================================================
*/

function convertirLetras(
    frase,
    comienzo,
    velocidad
){

    return frase
        .split(" ")
        .map(palabra=>{

            return `
                <span class="palabra">
                    ${
                        palabra
                        .split("")
                        .map((letra,i)=>{

                            const delay=
                                comienzo+
                                i*velocidad;

                            return `
                                <span
                                    class="letra"
                                    style="
                                    animation-delay:
                                    ${delay}ms"
                                >${letra}</span>
                            `;

                        })
                        .join("")
                    }
                </span>
            `;

        })
        .join("");
}


/*
==================================================
ANIMACIÓN
==================================================
*/

function dibujar(){

    const ahora=
        performance.now();

    const t=
        (ahora-inicio)/1000;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
    Árbol
    */

    for(const rama of ramas){

        dibujarRama(
            rama,
            t
        );
    }


    /*
    Raíces
    */

    if(t>2){

        dibujarRaices();
    }


    /*
    Flores de la copa
    */

    for(const flor of flores){

        let p=
            Math.max(
                0,
                Math.min(
                    1,
                    (t-flor.retraso)/.75
                )
            );

        if(p>0){

            const crecimiento=
                .08+
                .92*
                (
                    1-
                    Math.pow(
                        1-p,
                        3
                    )
                );

            dibujarFlor(
                flor.x,
                flor.y,
                flor.escala*
                crecimiento,
                flor.rotacion
            );
        }
    }


    /*
    Flores voladoras
    */

    for(const flor of floresVolando){

        const tiempo=
            ahora-inicio;


        if(tiempo<flor.inicio)
            continue;


        let p=
            (
                tiempo-
                flor.inicio
            )/
            flor.duracion;


        if(p>1)
            p=1;


        const movimiento=
            p*p*
            (3-2*p);


        let x=
            flor.ox+
            (
                flor.dx-
                flor.ox
            )*
            movimiento;


        let y=
            flor.oy+
            (
                flor.dy-
                flor.oy
            )*
            movimiento;


        y+=
            Math.sin(
                p*
                Math.PI*
                2*
                flor.frecuencia
            )*
            flor.amplitud;


        const rot=
            flor.rotacion+
            p*Math.PI*3;


        /*
        Desaparición al llegar
        */

        let alpha=1;

        if(p>.78){

            alpha=
                1-
                (
                    (p-.78)/
                    .22
                );
        }


        if(p<.08){

            alpha=
                Math.min(
                    alpha,
                    p/.08
                );
        }


        if(alpha>0){

            dibujarFlor(
